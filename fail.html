<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>결제 실패 — 한끼통살</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg);
      font-family: var(--font-body);
    }

    .result-card {
      width: 100%;
      max-width: 360px;
      margin: 20px;
      padding: 32px 24px;
      background: var(--card);
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(74, 47, 39, 0.08);
      text-align: center;
    }

    .result-card__icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #E24C4C;
      color: #fff;
      font-size: 28px;
    }

    .result-card__title {
      font-size: 18px;
      font-weight: 800;
      color: var(--brown);
      margin-bottom: 6px;
    }

    .result-card__subtitle {
      font-size: 13px;
      color: var(--text-sub);
      margin-bottom: 24px;
      word-break: keep-all;
    }

    .result-card__home {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <div class="result-card">
    <div class="result-card__icon" aria-hidden="true">✕</div>
    <p class="result-card__title">결제에 실패했어요</p>
    <p class="result-card__subtitle" id="resultMessage">결제가 취소되었거나 오류가 발생했습니다</p>

    <a class="result-card__home" href="index.html">한끼통살 홈으로</a>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var message = params.get('message');
      if (message) {
        document.getElementById('resultMessage').textContent = message;
      }
    })();
  </script>
</body>

</html>
